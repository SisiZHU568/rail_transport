# debug.yaml
#
# 这是项目早期调试使用的配置文件。
# 当前参数主要用于验证代码逻辑，不是最终论文参数。

simulation:
  # 一个快时隙持续多少秒
  fast_slot_seconds: 1.0

  # 一个慢时间帧包含多少个快时隙
  slow_frame_slots: 10

  # 一个 episode 包含多少个慢帧
  episode_frames: 20

  # 随机种子，固定后可以保证实验可复现
  random_seed: 42

topology:
  # 轨旁 MEC 数量
  mec_count: 5

  # 相邻 MEC 之间的距离，单位为米
  mec_spacing_m: 2000.0

  # 每个 MEC 的覆盖半径，单位为米
  mec_coverage_radius_m: 1200.0

  # 是否加入车载边缘节点
  include_onboard: true

  # 是否加入中心云
  include_cloud: true

node_resources:
  # 轨旁 MEC 资源
  mec_cpu_capacity: 100.0
  mec_memory_mb: 8192.0
  mec_reliability: 0.98

  # 车载边缘节点资源
  onboard_cpu_capacity: 60.0
  onboard_memory_mb: 4096.0
  onboard_reliability: 0.99

  # 中心云资源
  cloud_cpu_capacity: 1000.0
  cloud_memory_mb: 65536.0
  cloud_reliability: 0.999

  # 中心云使用独立故障域，避免被误建模为某个轨旁区域的一部分
  cloud_fault_domain_id: 3

train:
  # 列车初始位置，单位为米
  initial_position_m: 0.0

  # 250 km/h 约等于 69.44 m/s
  speed_mps: 69.44

serverless:
  # 容器连续空闲多少个时隙后被销毁
  survival_slots: 20

  # 同一函数允许的最大副本数量
  max_replicas: 3

  # ============================================================
# 容器保留策略对比实验参数
# ============================================================

cost:
  # 每 1 ms 用户请求时延对应的归一化成本
  delay_cost_per_ms: 1.0

  # 一个温容器每占用 1 MB 内存、持续 1 秒产生的成本
  #
  # 当前只是调试权重，不是最终论文中的真实货币成本。
  warm_memory_cost_per_mb_second: 0.1

  # 主动预热产生的启动资源成本权重
  #
  # 主动预热不会增加用户请求时延，
  # 但会消耗镜像加载、CPU 和内存等资源。
  prewarm_start_cost_per_ms: 4.0

retention_demo:
  # 固定生存窗口策略允许容器连续空闲的时隙数量
  fixed_window_slots: 3

  # 每个元素表示一个时隙内到达的请求数量
  #
  # 这条请求轨迹同时包含：
  # 1. 短间隔请求；
  # 2. 长时间空闲；
  # 3. 突发请求。
  request_trace:
    - 0
    - 0
    - 2
    - 0
    - 0
    - 1
    - 0
    - 0
    - 0
    - 0
    - 3
    - 0
    - 1
    - 0
    - 0
    - 0
    - 0
    - 0
    - 2
    - 0
    - 0
    - 1
    - 0
    - 0
    - 0
    - 4
    - 0
    - 0
    - 1
    - 0

   # ============================================================
# MEC 网络与 SFC 执行实验参数
# ============================================================

network:
  # 相邻轨旁 MEC 之间的可用带宽，单位为 Mbps
  #
  # 1000 Mbps 等于 1 Gbps。
  adjacent_bandwidth_mbps: 1000.0

  # 数据每经过一个 MEC 跳数产生的传播与转发时延
  propagation_delay_per_hop_ms: 2.0

  # 轨旁数据每传输 1 MB、每经过一跳产生的经济成本
  edge_data_cost_per_mb_hop: 0.01

  # 轨旁 MEC 到中心云的回传链路带宽，单位为 Mbps
  cloud_backhaul_bandwidth_mbps: 500.0

  # 轨旁 MEC 到中心云的单向固定传播时延，单位为毫秒
  cloud_one_way_propagation_delay_ms: 40.0

  # 每向中心云发送或从中心云返回 1 MB 数据产生的成本
  cloud_data_cost_per_mb: 0.20

sfc_demo:
  # 原始数据最开始位于哪个 MEC。
  # 这里设为 MEC-1，其 node_id 为 0。
  source_mec_id: 0

  # 单个 SFC 请求的初始输入数据量，单位为 MB
  input_size_mb: 2.0

  # 集中部署方案：
  # 三个函数全部部署在 MEC-1
  local_placement:
    - 0
    - 0
    - 0

  # 分布式部署方案：
  # 函数0部署在 MEC-1
  # 函数1部署在 MEC-2
  # 函数2部署在 MEC-3
  distributed_placement:
    - 0
    - 1
    - 2

  # SFC 执行结束后，是否将最终结果返回原始接入 MEC
  return_result_to_source: true 

  # ============================================================
# 完整离散时隙仿真器参数
# ============================================================

integrated_simulation:
  # 单个请求的输入数据量，单位为 MB
  input_size_mb_per_request: 2.0

  # 容器连续空闲多少个时隙后被销毁
  #
  # 当前设置为 5，表示容器连续空闲 5 个时隙后回收。
  survival_slots: 5

  # 请求轨迹用完后是否循环使用
  #
  # true 表示下面的 10 个时隙请求轨迹会不断重复，
  # 直到列车到达线路终点。
  repeat_request_trace: true

  # 每个元素表示一个快时隙内到达的请求数量
  #
  # 时隙0：0个请求
  # 时隙1：1个请求
  # 时隙2：0个请求
  # 时隙3：2个请求
  # ...
  request_trace:
    - 0
    - 1
    - 0
    - 2
    - 1
    - 0
    - 0
    - 3
    - 0
    - 1

    # ============================================================
# 轨迹感知提前预热策略参数
# ============================================================

prewarming_demo:
  # 是否在比较实验中启用轨迹感知预热
  enabled: true

  # 当列车距离切换时刻不超过多少秒时，
  # 开始在下一轨旁 MEC 上预热整条 SFC。
  #
  # 当前设置为3秒。
  # 例如列车预计2.4秒后切换到MEC-2，
  # 则提前在MEC-2启动三个函数容器。
  lead_time_s: 3.0

  # ============================================================
# 完整仿真中的综合成本权重
# ============================================================

simulation_cost:
  # 每 1 ms 用户端到端时延对应的归一化成本
  delay_cost_per_ms: 1.0

  # 温容器占用 1 MB 内存并持续 1 秒产生的成本
  warm_memory_cost_per_mb_second: 0.01

  # 后台主动预热每消耗 1 ms 启动时间产生的成本
  prewarm_start_cost_per_ms: 0.2

prediction_cost_demo:
  # 提前预测场景：认为切换时间比真实情况早 4 秒
  early_time_bias_s: -4.0

  # 滞后预测场景：认为切换时间比真实情况晚 4 秒
  late_time_bias_s: 4.0

  # 错误目标场景：将下一 MEC 向前错误偏移 1 跳
  wrong_mec_hop_offset: 1

  # ============================================================
# 故障域感知可靠性模型
# ============================================================

reliability:
  # 每个函数默认部署的副本数量。
  #
  # replica_count=2 表示：
  # 1个主实例 + 1个备用实例。
  replica_count: 2

  # 一组函数副本至少需要分布在多少个不同故障域。
  #
  # 当前设置为2，表示主实例和备用实例
  # 不允许位于同一个故障域。
  minimum_distinct_fault_domains: 2

  # 故障域的可用率。
  #
  # 故障域故障可理解为：
  # 公共供电故障、汇聚交换机故障、
  # 公共回传链路故障或区域性基础设施故障。
  fault_domains:
    - domain_id: 0
      availability: 0.995

    - domain_id: 1
      availability: 0.995

    - domain_id: 2
      availability: 0.995

    # 中心云独立故障域
    - domain_id: 3
      availability: 0.999

  # ============================================================
# 运行态随机故障与主备切换参数
# ============================================================

runtime_failure:
  # 随机种子，用于保证多次实验可以复现
  random_seed: 42

  # 故障域处于失效状态时，
  # 每个时隙恢复正常的概率
  domain_recovery_probability_per_slot: 0.4

  # MEC 节点局部失效后，
  # 每个时隙恢复正常的概率
  node_recovery_probability_per_slot: 0.5

  # 每个函数从主实例切换到备用实例时，
  # 产生的故障检测与状态切换时延
  failover_delay_ms_per_function: 20.0

  # ============================================================
# 单副本、热备、冷备和轨迹感知动态主备对比
# ============================================================

standby_mode_demo:
  # 距离 MEC 切换不超过该时间时，
  # 动态主备策略将备用实例转为温实例。
  trajectory_lead_time_s: 3.0

  # 为了清楚比较四种主备模式，
  # 在有请求的时隙人为令当前主节点失效。
  #
  # node_id 从0开始：
  # node_id=1 对应 MEC-2。
  scripted_node_failures:
    - time_slot: 17
      node_id: 1

    # 时隙41接近从MEC-2切换至MEC-3，
    # 用于验证轨迹感知策略的温备用接管。
    - time_slot: 41
      node_id: 1

    - time_slot: 44
      node_id: 2

  # 故障域失效会同时影响域内全部节点。
  scripted_domain_failures:
    - time_slot: 73
      domain_id: 1

    - time_slot: 101
      domain_id: 2

  # ============================================================
# 多随机种子蒙特卡洛实验参数
# ============================================================

monte_carlo:
  # 独立随机故障轨迹数量。
  #
  # 调试阶段使用30次；
  # 正式论文实验建议提高到100或更多。
  num_runs: 30

  # 第一次实验使用的随机种子。
  #
  # 第k次实验的随机种子：
  # base_seed + k
  base_seed: 1000

  # 置信水平。
  #
  # 0.95 表示输出95%置信区间。
  confidence_level: 0.95

  # ============================================================
# 双时间尺度控制参数
# ============================================================

two_timescale:
  # 慢时间尺度决策周期。
  #
  # 每10个快时隙重新决定：
  # 1. 是否部署跨故障域副本；
  # 2. 备用副本采用冷备还是热备。
  slow_period_slots: 10

  # 距离切换不超过该时间时，
  # 快时间尺度临时激活备用实例。
  handover_hot_window_s: 3.0

  # SFC可靠性目标达到该阈值时，
  # 慢时间尺度必须启用跨故障域副本。
  redundancy_reliability_threshold: 0.99

  # 预测故障风险达到该阈值时，
  # 采用全热备模式。
  high_failure_risk_threshold: 0.10

  # 预测请求负载达到该阈值时，
  # 采用全热备模式。
  hot_load_threshold_requests_per_slot: 2.0

  # ============================================================
# 双时间尺度完整对比实验
# ============================================================

two_timescale_experiment:
  # 正常时段的预测故障风险
  default_failure_risk: 0.02

  # 高风险时段的预测故障风险
  high_failure_risk: 0.20

  # 以下时间段被认为是高故障风险窗口。
  #
  # 双时间尺度控制器会在这些窗口内
  # 将基础冷备模式调整为全热备模式。
  high_risk_windows:
    - start_slot: 30
      end_slot: 49

    - start_slot: 90
      end_slot: 109

# ============================================================
# 双时间尺度综合成本参数
# ============================================================

two_timescale_cost:
  # 每1 ms用户端到端时延对应的成本
  delay_cost_per_ms: 1.0

  # 温实例占用1 MB内存并持续1秒的成本
  memory_cost_per_mb_second: 0.01

  # 冷启动每消耗1 ms启动时间对应的资源成本
  cold_start_cost_per_ms: 0.20

  # 每个失败批次或成功但超时批次的惩罚
  sla_violation_penalty_per_batch: 5000.0

  # 每次执行慢时间尺度决策的控制成本
  slow_decision_cost: 20.0

  # 一个函数的副本部署节点发生变化时的重配置成本
  replica_reconfiguration_cost_per_function: 50.0

  # ============================================================
# 双时间尺度多随机种子实验
# ============================================================

two_timescale_monte_carlo:
  # 每种策略运行的独立随机故障轨迹数量
  #
  # 调试阶段使用30；
  # 正式论文实验建议使用100或更多。
  num_runs: 30

  # 第k次实验的随机种子：
  # base_seed + k
  base_seed: 5000

  # 输出95%置信区间
  confidence_level: 0.95

  # 高风险窗口内，将基础失效概率放大多少倍
  #
  # 例如基础节点失效概率为0.01，
  # 放大8倍后约为0.08。
  high_risk_failure_multiplier: 8.0

  # ============================================================
# 强化学习环境参数
# ============================================================

rl_environment:
  # reset() 未显式指定随机种子时使用的默认种子
  default_seed: 8000

  # 奖励函数各组成部分的权重
  #
  # 奖励范围近似为 [-1, 0]：
  # 系统成本越低，奖励越接近0；
  # 系统表现越差，奖励越接近-1。
  reward_weights:
    delay: 0.20
    memory: 0.20
    cold_start: 0.15
    sla_violation: 0.40
    reconfiguration: 0.05
