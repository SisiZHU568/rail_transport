# debug.yaml
#
# 这是项目早期调试使用的配置文件。
# 当前参数主要用于验证代码逻辑，不是最终论文参数。

simulation:
  # 一个快时隙持续多少秒
  fast_slot_seconds: 1.0

  # 一个慢时间帧包含多少个快时隙
  slow_frame_slots: 10

  # 一个 episode 包含多少个慢帧
  episode_frames: 20

  # 随机种子，固定后可以保证实验可复现
  random_seed: 42

topology:
  # 轨旁 MEC 数量
  mec_count: 5

  # 相邻 MEC 之间的距离，单位为米
  mec_spacing_m: 2000.0

  # 每个 MEC 的覆盖半径，单位为米
  mec_coverage_radius_m: 1200.0

  # 按 MEC-1、MEC-2……的顺序显式声明故障域。
  # 扩充 mec_count 时需要同步补充列表，避免代码用下标猜测故障域。
  mec_fault_domain_ids:
    - 0
    - 0
    - 1
    - 1
    - 2

  # 是否加入中心云
  include_cloud: true

node_resources:
  # 轨旁 MEC 资源
  mec_cpu_capacity: 100.0
  mec_memory_mb: 8192.0
  mec_cpu_capacity_cycles_per_second: 20000000000.0
  mec_core_count: 8

  # 中心云资源
  cloud_cpu_capacity: 1000.0
  cloud_memory_mb: 65536.0
  cloud_cpu_capacity_cycles_per_second: 100000000000.0
  cloud_core_count: 32

  # 中心云使用独立故障域，避免被误建模为某个轨旁区域的一部分
  cloud_fault_domain_id: 3

# ============================================================
# 阶段 C：快时隙连续资源分配参数
# ============================================================
fast_resource_optimization:
  solver: CLARABEL
  max_iterations: 200
  # CLARABEL 偶尔返回 OPTIMAL_INACCURATE；只有全部物理残差仍通过时才接受。
  allow_optimal_inaccurate: true
  noise_psd_watt_per_hz: 1.0e-12
  energy_price_per_joule: 0.01
  absolute_lex_tolerance: 1.0e-7
  relative_lex_tolerance: 1.0e-7
  residual_tolerance: 1.0e-5
  active_time_tolerance_seconds: 1.0e-9
  mec_dvfs_kappa: 1.0e-27
  cloud_dvfs_kappa: 1.0e-27
  mec_cpu_price_per_second: 0.10
  cloud_cpu_price_per_second: 0.20
  cloud_price_per_gcycle: 0.05
  uplink_bandwidth_hz: 20000000.0
  maximum_uplink_power_watt: 2.0

# ============================================================
# 阶段 A：实例生命周期和允许部署组合
# ============================================================

instance_lifecycle:
  schema_version: phase-a-v1
  price_version: debug-price-v1

  # 零秒是合法档，表示不额外承诺保留；仍存在的实例按运行秒计费。
  minimum_retention_seconds: 0.0
  maximum_retention_seconds: 20.0
  retention_step_seconds: 5.0

  # 首版所有 VNF 均可部署在 5 个 MEC（0-4）和中心云（5）。
  # 实例范围、单实例容量、冷启动和价格均按 VNF—节点组合读取。
  allowed_deployments:
    - function_id: 0
      node_ids: [0, 1, 2, 3, 4, 5]
      minimum_instances: 1
      maximum_instances: 4
      cold_start_seconds: 0.3
      single_instance_max_cpu_cycles_per_second: 2000000000.0
      deployment_cost_per_instance: 1.0
      cold_start_cost_per_instance: 0.3
      running_cost_per_instance_second: 0.001

    - function_id: 1
      node_ids: [0, 1, 2, 3, 4, 5]
      minimum_instances: 1
      maximum_instances: 4
      cold_start_seconds: 0.5
      single_instance_max_cpu_cycles_per_second: 2000000000.0
      deployment_cost_per_instance: 1.0
      cold_start_cost_per_instance: 0.5
      running_cost_per_instance_second: 0.001

    - function_id: 2
      node_ids: [0, 1, 2, 3, 4, 5]
      minimum_instances: 1
      maximum_instances: 4
      cold_start_seconds: 0.8
      single_instance_max_cpu_cycles_per_second: 2000000000.0
      deployment_cost_per_instance: 1.0
      cold_start_cost_per_instance: 0.8
      running_cost_per_instance_second: 0.001

train:
  # 列车初始位置，单位为米
  initial_position_m: 0.0

  # 250 km/h 约等于 69.44 m/s
  speed_mps: 69.44

serverless:
  # 容器连续空闲多少个时隙后被销毁
  survival_slots: 20

  # 同一函数允许的最大副本数量
  max_replicas: 3

# ============================================================
# 学习环境使用的 VNF 与 SFC 定义
# ============================================================

rl_scenario:
  # 列表顺序会成为状态编码和联合动作中的固定 VNF 顺序。
  # 扩充或缩减 SFC 时只修改这里，不修改 Python 源码。
  functions:
    - function_id: 0
      name: 数据清洗
      memory_mb: 256.0
      cpu_cycles_per_request: 20.0
      image_size_mb: 80.0
      warm_exec_time_ms: 15.0
      cold_start_time_ms: 300.0
      output_ratio: 0.7
      # 快层真实工作量单位：处理一个物理输入 bit 所需 CPU 周期数
      cpu_cycles_per_input_bit: 1000.0

    - function_id: 1
      name: 特征提取
      memory_mb: 512.0
      cpu_cycles_per_request: 40.0
      image_size_mb: 150.0
      warm_exec_time_ms: 30.0
      cold_start_time_ms: 500.0
      output_ratio: 0.4
      cpu_cycles_per_input_bit: 1500.0

    - function_id: 2
      name: 异常检测
      memory_mb: 768.0
      cpu_cycles_per_request: 60.0
      image_size_mb: 300.0
      warm_exec_time_ms: 50.0
      cold_start_time_ms: 800.0
      output_ratio: 0.1
      cpu_cycles_per_input_bit: 2000.0

  sfc:
    sfc_id: 0
    name: 高可靠列车设备故障诊断
    # 这里决定 VNF 的实际执行顺序，必须且只能引用上面声明的 VNF。
    function_ids:
      - 0
      - 1
      - 2
    deadline_ms: 1500.0
    reliability_target: 0.99
    priority: critical
    input_size_mb_per_request: 2.0

  # ============================================================
# 容器保留策略对比实验参数
# ============================================================

cost:
  # 每 1 ms 用户请求时延对应的归一化成本
  delay_cost_per_ms: 1.0

  # 一个温容器每占用 1 MB 内存、持续 1 秒产生的成本
  #
  # 当前只是调试权重，不是最终论文中的真实货币成本。
  warm_memory_cost_per_mb_second: 0.1

  # 主动预热产生的启动资源成本权重
  #
  # 主动预热不会增加用户请求时延，
  # 但会消耗镜像加载、CPU 和内存等资源。
  prewarm_start_cost_per_ms: 4.0

retention_demo:
  # 固定生存窗口策略允许容器连续空闲的时隙数量
  fixed_window_slots: 3

  # 每个元素表示一个时隙内到达的请求数量
  #
  # 这条请求轨迹同时包含：
  # 1. 短间隔请求；
  # 2. 长时间空闲；
  # 3. 突发请求。
  request_trace:
    - 0
    - 0
    - 2
    - 0
    - 0
    - 1
    - 0
    - 0
    - 0
    - 0
    - 3
    - 0
    - 1
    - 0
    - 0
    - 0
    - 0
    - 0
    - 2
    - 0
    - 0
    - 1
    - 0
    - 0
    - 0
    - 4
    - 0
    - 0
    - 1
    - 0

   # ============================================================
# MEC 网络与 SFC 执行实验参数
# ============================================================

network:
  # 相邻轨旁 MEC 之间的可用带宽，单位为 Mbps
  #
  # 1000 Mbps 等于 1 Gbps。
  adjacent_bandwidth_mbps: 1000.0

  # 数据每经过一个 MEC 跳数产生的传播与转发时延
  propagation_delay_per_hop_ms: 2.0

  # 轨旁数据每传输 1 MB、每经过一跳产生的经济成本
  edge_data_cost_per_mb_hop: 0.01

  # 轨旁 MEC 到中心云的回传链路带宽，单位为 Mbps
  cloud_backhaul_bandwidth_mbps: 500.0

  # 轨旁 MEC 到中心云的单向固定传播时延，单位为毫秒
  cloud_one_way_propagation_delay_ms: 40.0

  # 每向中心云发送或从中心云返回 1 MB 数据产生的成本
  cloud_data_cost_per_mb: 0.20

sfc_demo:
  # 原始数据最开始位于哪个 MEC。
  # 这里设为 MEC-1，其 node_id 为 0。
  source_mec_id: 0

  # 单个 SFC 请求的初始输入数据量，单位为 MB
  input_size_mb: 2.0

  # 集中部署方案：
  # 三个函数全部部署在 MEC-1
  local_placement:
    - 0
    - 0
    - 0

  # 分布式部署方案：
  # 函数0部署在 MEC-1
  # 函数1部署在 MEC-2
  # 函数2部署在 MEC-3
  distributed_placement:
    - 0
    - 1
    - 2

  # SFC 执行结束后，是否将最终结果返回原始接入 MEC
  return_result_to_source: true 

  # ============================================================
# 完整离散时隙仿真器参数
# ============================================================

integrated_simulation:
  # 单个请求的输入数据量，单位为 MB
  input_size_mb_per_request: 2.0

  # 容器连续空闲多少个时隙后被销毁
  #
  # 当前设置为 5，表示容器连续空闲 5 个时隙后回收。
  survival_slots: 5

  # 请求轨迹用完后是否循环使用
  #
  # true 表示下面的 10 个时隙请求轨迹会不断重复，
  # 直到列车到达线路终点。
  repeat_request_trace: true

  # 每个元素表示一个快时隙内到达的请求数量
  #
  # 时隙0：0个请求
  # 时隙1：1个请求
  # 时隙2：0个请求
  # 时隙3：2个请求
  # ...
  request_trace:
    - 0
    - 1
    - 0
    - 2
    - 1
    - 0
    - 0
    - 3
    - 0
    - 1

    # ============================================================
# 轨迹感知提前预热策略参数
# ============================================================

prewarming_demo:
  # 是否在比较实验中启用轨迹感知预热
  enabled: true

  # 当列车距离切换时刻不超过多少秒时，
  # 开始在下一轨旁 MEC 上预热整条 SFC。
  #
  # 当前设置为3秒。
  # 例如列车预计2.4秒后切换到MEC-2，
  # 则提前在MEC-2启动三个函数容器。
  lead_time_s: 3.0

  # ============================================================
# 完整仿真中的综合成本权重
# ============================================================

simulation_cost:
  # 每 1 ms 用户端到端时延对应的归一化成本
  delay_cost_per_ms: 1.0

  # 温容器占用 1 MB 内存并持续 1 秒产生的成本
  warm_memory_cost_per_mb_second: 0.01

  # 后台主动预热每消耗 1 ms 启动时间产生的成本
  prewarm_start_cost_per_ms: 0.2

prediction_cost_demo:
  # 提前预测场景：认为切换时间比真实情况早 4 秒
  early_time_bias_s: -4.0

  # 滞后预测场景：认为切换时间比真实情况晚 4 秒
  late_time_bias_s: 4.0

  # 错误目标场景：将下一 MEC 向前错误偏移 1 跳
  wrong_mec_hop_offset: 1

  # ============================================================
# 故障域感知可靠性模型
# ============================================================

reliability:
  # 一组函数副本至少需要分布在多少个不同故障域。
  #
  # 当前设置为2，表示主实例和备用实例
  # 不允许位于同一个故障域。
  minimum_distinct_fault_domains: 2

  # ============================================================
# 运行态随机故障与主备切换参数
# ============================================================

runtime_failure:
  # 每个故障域和节点会从这个基础种子派生独立随机流。
  base_seed: 42

  # 连续时间故障率与恢复率，单位均为 1/秒。
  # 当前比值保持旧调试配置的稳态可用度，阶段 A 不按时隙概率反推。
  domain_rates:
    - {id: 0, failure_rate_per_second: 0.00005, recovery_rate_per_second: 0.00995}
    - {id: 1, failure_rate_per_second: 0.00005, recovery_rate_per_second: 0.00995}
    - {id: 2, failure_rate_per_second: 0.00005, recovery_rate_per_second: 0.00995}
    - {id: 3, failure_rate_per_second: 0.00001, recovery_rate_per_second: 0.00999}

  node_rates:
    - {id: 0, failure_rate_per_second: 0.0002, recovery_rate_per_second: 0.0098}
    - {id: 1, failure_rate_per_second: 0.0002, recovery_rate_per_second: 0.0098}
    - {id: 2, failure_rate_per_second: 0.0002, recovery_rate_per_second: 0.0098}
    - {id: 3, failure_rate_per_second: 0.0002, recovery_rate_per_second: 0.0098}
    - {id: 4, failure_rate_per_second: 0.0002, recovery_rate_per_second: 0.0098}
    - {id: 5, failure_rate_per_second: 0.00001, recovery_rate_per_second: 0.00999}

  # 每个函数从主实例切换到备用实例时，
  # 产生的故障检测与状态切换时延
  failover_delay_ms_per_function: 20.0

  # ============================================================
# 单副本、热备、冷备和轨迹感知动态主备对比
# ============================================================

standby_mode_demo:
  # 距离 MEC 切换不超过该时间时，
  # 动态主备策略将备用实例转为温实例。
  trajectory_lead_time_s: 3.0

  # 为了清楚比较四种主备模式，
  # 在有请求的时隙人为令当前主节点失效。
  #
  # node_id 从0开始：
  # node_id=1 对应 MEC-2。
  scripted_node_failures:
    - time_slot: 17
      node_id: 1

    # 时隙41接近从MEC-2切换至MEC-3，
    # 用于验证轨迹感知策略的温备用接管。
    - time_slot: 41
      node_id: 1

    - time_slot: 44
      node_id: 2

  # 故障域失效会同时影响域内全部节点。
  scripted_domain_failures:
    - time_slot: 73
      domain_id: 1

    - time_slot: 101
      domain_id: 2

  # ============================================================
# 多随机种子蒙特卡洛实验参数
# ============================================================

monte_carlo:
  # 独立随机故障轨迹数量。
  #
  # 调试阶段使用30次；
  # 正式论文实验建议提高到100或更多。
  num_runs: 30

  # 第一次实验使用的随机种子。
  #
  # 第k次实验的随机种子：
  # base_seed + k
  base_seed: 1000

  # 置信水平。
  #
  # 0.95 表示输出95%置信区间。
  confidence_level: 0.95

  # ============================================================
# 双时间尺度控制参数
# ============================================================

two_timescale:
  # 慢时间尺度决策周期。
  #
  # 每10个快时隙重新决定：
  # 1. 是否部署跨故障域副本；
  # 2. 备用副本采用冷备还是热备。
  slow_period_slots: 10

  # 距离切换不超过该时间时，
  # 快时间尺度临时激活备用实例。
  handover_hot_window_s: 3.0

  # SFC可靠性目标达到该阈值时，
  # 慢时间尺度必须启用跨故障域副本。
  redundancy_reliability_threshold: 0.99

  # 预测故障风险达到该阈值时，
  # 采用全热备模式。
  high_failure_risk_threshold: 0.10

  # 预测请求负载达到该阈值时，
  # 采用全热备模式。
  hot_load_threshold_requests_per_slot: 2.0

  # ============================================================
# 双时间尺度完整对比实验
# ============================================================

two_timescale_experiment:
  # 正常时段的预测故障风险
  default_failure_risk: 0.02

  # 高风险时段的预测故障风险
  high_failure_risk: 0.20

  # 以下时间段被认为是高故障风险窗口。
  #
  # 双时间尺度控制器会在这些窗口内
  # 将基础冷备模式调整为全热备模式。
  high_risk_windows:
    - start_slot: 30
      end_slot: 49

    - start_slot: 90
      end_slot: 109

# ============================================================
# 双时间尺度综合成本参数
# ============================================================

two_timescale_cost:
  # 每1 ms用户端到端时延对应的成本
  delay_cost_per_ms: 1.0

  # 温实例占用1 MB内存并持续1秒的成本
  memory_cost_per_mb_second: 0.01

  # 冷启动每消耗1 ms启动时间对应的资源成本
  cold_start_cost_per_ms: 0.20

  # 每个失败批次或成功但超时批次的惩罚
  sla_violation_penalty_per_batch: 5000.0

  # 每次执行慢时间尺度决策的控制成本
  slow_decision_cost: 20.0

  # 一个函数的副本部署节点发生变化时的重配置成本
  replica_reconfiguration_cost_per_function: 50.0

  # ============================================================
# 双时间尺度多随机种子实验
# ============================================================

two_timescale_monte_carlo:
  # 每种策略运行的独立随机故障轨迹数量
  #
  # 调试阶段使用30；
  # 正式论文实验建议使用100或更多。
  num_runs: 30

  # 第k次实验的随机种子：
  # base_seed + k
  base_seed: 5000

  # 输出95%置信区间
  confidence_level: 0.95

  # 高风险窗口内，将基础失效概率放大多少倍
  #
  # 例如基础节点失效概率为0.01，
  # 放大8倍后约为0.08。
  high_risk_failure_multiplier: 8.0

  # ============================================================
# 强化学习环境参数
# ============================================================

rl_environment:
  # reset() 未显式指定随机种子时使用的默认种子
  default_seed: 8000

  workload_prediction:
    lookback_slots: 10
    baseline_request_rate: 1.0

  state_normalization:
    maximum_request_rate: 5.0
    maximum_network_delay_ms: 200.0
    maximum_input_size_mb: 10.0

  cost_rates:
    edge_cpu_cost_per_unit: 0.01
    edge_memory_cost_per_mb_second: 0.001
    cloud_cpu_cost_per_unit: 0.05
    cloud_memory_cost_per_mb_second: 0.005
    cold_start_cost_per_ms: 0.10
    maximum_window_cost: 10000.0

# ============================================================
# DPPO 主算法配置
# ============================================================

dppo:
  diffusion:
    steps: 20
    fine_tuned_steps: 5
    noise_schedule: cosine
    hidden_dims:
      - 256
      - 256

  dataset:
    episodes: 1000
    seed_start: 40000
    # 教师规则变化会改变专家标签；版本进入配置哈希，防止混用新旧数据。
    teacher_schema_version: phase-e-service-first-multimodal-v1
    # 数据集划分只按 Episode seed 进行，固定随机种子保证划分可复现。
    split_seed: 41000
    # 一个 Episode 固定使用一种教师，Episode 之间按下列顺序循环。
    teacher_names:
      - cost
      - reliability
      - balanced
    # 调试阶段仅收集两个慢窗口，控制三副本精确修复的运行时间。
    # 正式生成论文数据前应根据算力和线路覆盖范围提高该配置。
    max_slow_steps_per_episode: 2
    train_fraction: 0.70
    validation_fraction: 0.15
    test_fraction: 0.15
    output_root: results/dppo/datasets

  pretraining:
    # 用真实 optimizer.step 次数计量训练量，数据规模变化时实验含义不变。
    optimizer_steps: 200
    # 固定间隔检查验证集，并保存验证损失最低的模型。
    validation_interval_steps: 10
    batch_size: 64
    learning_rate: 0.0003
    gradient_clip_norm: 5.0
    seed: 12000
    output_root: results/dppo/pretraining

  training:
    # 在线训练的外层迭代次数和每次迭代收集的完整 Episode 数量。
    iterations: 200
    episodes_per_iteration: 8
    gamma: 0.99
    gae_lambda: 0.95
    clip_ratio: 0.20
    # 越接近最终动作，PPO 裁剪范围按唯一几何公式由 0.001 增长到候选值。
    clip_ratio_base: 0.001
    denoising_discount: 0.99
    # 同一真实 rollout 对照表明 0.0001 可在 target_kl=1.0 内完成更新；
    # 0.0003 会在联合动作上产生 KL 过冲，因此 debug 闭环采用更稳健学习率。
    policy_learning_rate: 0.0001
    value_learning_rate: 0.0003
    # 价值网络结构独立配置，扩充状态维度时不需要修改 Python 源码。
    value_hidden_dims:
      - 256
      - 256
    batch_size: 64
    update_epochs: 10
    # 在线 PPO 每累计 16 个完整慢帧才提交一次事务更新；内部失败整段丢弃。
    rollout_length_slow_frames: 16
    gradient_clip_norm: 5.0
    # 每个小批次统一标准化优势，避免不同 Episode 的回报尺度影响 PPO 更新。
    normalize_advantages: true
    # Rollout 顺序、价值网络初始化和小批次打乱使用同一个实验种子。
    seed: 13000
    device: cpu
    output_root: results/dppo/training

  stability:
    # 训练采样保留适度探索噪声；概率重算使用更保守的标准差下限，
    # 评估采样只保留极小随机性，三者用途不同，不能共用一个 std。
    training_sampling_min_std: 0.01
    probability_min_std: 0.10
    evaluation_sampling_min_std: 0.001
    target_kl: 1.0
    # 官方 DPPO 的裁剪阈值会从 0.001 分阶段增长，clip fraction 天然高于
    # 传统固定阈值 PPO；该区间仅用于快速校准，不是论文最终调参结论。
    target_clip_fraction_min: 0.60
    target_clip_fraction_max: 0.85
    clip_ratio_candidates:
      - 0.10
      - 0.01
      - 0.001
    # debug 配置只验证完整链路；正式实验应另建配置并扩大校准样本。
    calibration_iterations: 1
    calibration_episodes_per_iteration: 1
    # 随机种子按用途隔离：在线训练从 13000 开始，校准从 20000 开始，
    # 后续独立评估使用 30000 及以上，防止轨迹在不同阶段意外复用。
    calibration_seed_start: 20000

# ============================================================
# 阶段 E 最小在线闭环运行参数（GPU DPPO + CPU CLARABEL）
# ============================================================
phase_e_runtime:
  channel_gain: 1.0e-6
  reference_cost_per_slow_frame: 100.0
  smoke_arrival_equivalent_bits: 200000.0
  smoke_deadline_seconds: 10.0
